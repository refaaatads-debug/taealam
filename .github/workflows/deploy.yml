            if [ "${RUN_INPERSON_PRICING_MIGRATION:-false}" = "true" ]; then
              db_container="$(docker ps --filter name=supabase-db --format '{{.Names}}' | head -n 1)"
              test -n "$db_container"
              pricing_migration_applied="$(docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'financial_settings' AND column_name = 'in_person_default_teacher_rate_sar') AND to_regprocedure('public.admin_get_in_person_pricing()') IS NOT NULL AND EXISTS (SELECT 1 FROM information_schema.triggers WHERE trigger_schema = 'public' AND trigger_name = 'snapshot_in_person_booking_price_trigger')")"
              if [ "$pricing_migration_applied" = "t" ]; then
                echo "Skipping in-person pricing migration: its production schema markers already exist."
              else
                docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < "$staging/supabase/migrations/20261021001000_in_person_teacher_pricing.sql"
              fi
            else
              echo "Skipping in-person pricing migration: this change did not modify its SQL file."
            fi
            if [ "${RUN_FINANCIAL_MIGRATIONS:-false}" = "true" ]; then
              db_container="$(docker ps --filter name=supabase-db --format '{{.Names}}' | head -n 1)"
              test -n "$db_container"
              hash_011="$(sha256sum "$staging/supabase/migrations/20261021001100_in_person_session_lifecycle.sql" | awk '{print $1}')"
              hash_012="$(sha256sum "$staging/supabase/migrations/20261021001200_mode_aware_booking_expiry.sql" | awk '{print $1}')"
              test "$hash_011" = "4f30245ae45bcf4da440307526346f701542d504b1187f0692c683e20092a647"
              test "$hash_012" = "18d3e3961b2813b6e40e98770214dc49c40e16bf09f82b876e27d8037cb8a822"
              legacy_applied="$(docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT to_regprocedure('public.confirm_in_person_attendance_code(uuid,text)') IS NOT NULL AND to_regprocedure('public.process_in_person_session_completions()') IS NOT NULL AND EXISTS (SELECT 1 FROM cron.job WHERE jobname = 'process-in-person-session-completions') AND pg_get_functiondef('public.auto_expire_stale_bookings()'::regprocedure) LIKE '%delivery_mode%'")"
              if [ "$legacy_applied" != "t" ]; then
                echo "Refusing to run finance migrations: live 011/012 markers are not present; they will not be reapplied automatically." >&2
                exit 1
              fi
              docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
            CREATE TABLE IF NOT EXISTS public.deployed_migration_fingerprints (
              migration_name text PRIMARY KEY,
              sha256 text NOT NULL CHECK (sha256 ~ '^[0-9a-f]{64}$'),
              recorded_at timestamptz NOT NULL DEFAULT now(),
              source text NOT NULL
            );
            ALTER TABLE public.deployed_migration_fingerprints ENABLE ROW LEVEL SECURITY;
            REVOKE ALL ON TABLE public.deployed_migration_fingerprints FROM PUBLIC, anon, authenticated, service_role;
            SQL
              record_legacy_fingerprint() {
                name="$1"
                file_hash="$2"
                existing="$(docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT sha256 FROM public.deployed_migration_fingerprints WHERE migration_name = '$name'")"
                if [ -n "$existing" ] && [ "$existing" != "$file_hash" ]; then
                  echo "Stored fingerprint mismatch for $name; refusing to continue." >&2
                  exit 1
                fi
                if [ -z "$existing" ]; then
                  docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "INSERT INTO public.deployed_migration_fingerprints(migration_name,sha256,source) VALUES ('$name','$file_hash','verified existing production migration')"
                fi
              }
              record_legacy_fingerprint "20261021001100_in_person_session_lifecycle.sql" "$hash_011"
              record_legacy_fingerprint "20261021001200_mode_aware_booking_expiry.sql" "$hash_012"
              apply_guarded_migration() {
                migration_file="$1"
                migration_name="$(basename "$migration_file")"
                migration_hash="$(sha256sum "$migration_file" | awk '{print $1}')"
                stored_hash="$(docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT sha256 FROM public.deployed_migration_fingerprints WHERE migration_name = '$migration_name'")"
                if [ -n "$stored_hash" ]; then
                  if [ "$stored_hash" != "$migration_hash" ]; then
                    echo "Stored fingerprint mismatch for $migration_name; refusing to reapply." >&2
                    exit 1
                  fi
                  echo "Skipping already-applied migration $migration_name (fingerprint matches)."
                  return
                fi
                {
                  printf 'BEGIN;\n'
                  cat "$migration_file"
                  printf "\nINSERT INTO public.deployed_migration_fingerprints(migration_name,sha256,source) VALUES ('%s','%s','GitHub Actions') ON CONFLICT (migration_name) DO NOTHING;\nCOMMIT;\n" "$migration_name" "$migration_hash"
                } | docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres
              }
              apply_guarded_migration "$staging/supabase/migrations/20261021001300_in_person_session_financial_gates.sql"
              apply_guarded_migration "$staging/supabase/migrations/20261021001400_idempotent_online_session_earning_rollup.sql"
              apply_guarded_migration "$staging/supabase/migrations/20261021001500_financial_snapshot_and_duration_safety.sql"
              apply_guarded_migration "$staging/supabase/migrations/20261026000100_configurable_in_person_package_minutes.sql"
              duration_migration_hash="$(sha256sum "$staging/supabase/migrations/20261026000100_configurable_in_person_package_minutes.sql" | awk '{print $1}')"
              duration_migration_stored_hash="$(docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT sha256 FROM public.deployed_migration_fingerprints WHERE migration_name = '20261026000100_configurable_in_person_package_minutes.sql'")"
              test "${#duration_migration_hash}" -eq 64
              test -n "$duration_migration_stored_hash"
              test "$duration_migration_hash" = "$duration_migration_stored_hash"
              echo "Migrations 013-015 and configurable in-person duration applied or fingerprint-verified; 011/012 were fingerprinted and never re-run."
            else
              echo "Skipping session finance migrations: no related SQL file changed."
            fi
      - name: Apply payout migrations and activate the verified build
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          RUN_REPORTING_WITHDRAWAL_MIGRATIONS: ${{ steps.reporting-withdrawal-migration-scope.outputs.run }}
          RUN_EDGE_FUNCTIONS: ${{ steps.edge-function-scope.outputs.run }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          envs: DEPLOY_SHA,RUN_REPORTING_WITHDRAWAL_MIGRATIONS,RUN_EDGE_FUNCTIONS
          script: |
            set -eu
            staging=/tmp/ajyal-build-$DEPLOY_SHA
            test -f "$staging/dist/index.html"
            if [ "${RUN_REPORTING_WITHDRAWAL_MIGRATIONS:-false}" = "true" ]; then
              db_container="$(docker ps --filter name=supabase-db --format '{{.Names}}' | head -n 1)"
              test -n "$db_container"
              hash_011="$(sha256sum "$staging/supabase/migrations/20261021001100_in_person_session_lifecycle.sql" | awk '{print $1}')"
              hash_012="$(sha256sum "$staging/supabase/migrations/20261021001200_mode_aware_booking_expiry.sql" | awk '{print $1}')"
              test "$hash_011" = "4f30245ae45bcf4da440307526346f701542d504b1187f0692c683e20092a647"
              test "$hash_012" = "18d3e3961b2813b6e40e98770214dc49c40e16bf09f82b876e27d8037cb8a822"
              live_legacy="$(docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT to_regprocedure('public.confirm_in_person_attendance_code(uuid,text)') IS NOT NULL AND to_regprocedure('public.process_in_person_session_completions()') IS NOT NULL AND EXISTS (SELECT 1 FROM cron.job WHERE jobname = 'process-in-person-session-completions') AND pg_get_functiondef('public.auto_expire_stale_bookings()'::regprocedure) LIKE '%delivery_mode%'")"
              if [ "$live_legacy" != "t" ]; then
                echo "Refusing reporting/withdrawal migrations: live 011/012 markers are missing." >&2
                exit 1
              fi
              docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
            CREATE TABLE IF NOT EXISTS public.deployed_migration_fingerprints (
              migration_name text PRIMARY KEY,
              sha256 text NOT NULL CHECK (sha256 ~ '^[0-9a-f]{64}$'),
              recorded_at timestamptz NOT NULL DEFAULT now(),
              source text NOT NULL
            );
            ALTER TABLE public.deployed_migration_fingerprints ENABLE ROW LEVEL SECURITY;
            REVOKE ALL ON TABLE public.deployed_migration_fingerprints FROM PUBLIC, anon, authenticated, service_role;
            SQL
              for item in \
                "20261021001100_in_person_session_lifecycle.sql:$hash_011" \
                "20261021001200_mode_aware_booking_expiry.sql:$hash_012"; do
                name="${item%%:*}"
                hash="${item#*:}"
                stored="$(docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT sha256 FROM public.deployed_migration_fingerprints WHERE migration_name = '$name'")"
                if [ -n "$stored" ] && [ "$stored" != "$hash" ]; then
                  echo "Stored fingerprint mismatch for $name; refusing to continue." >&2
                  exit 1
                fi
                if [ -z "$stored" ]; then
                  docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "INSERT INTO public.deployed_migration_fingerprints(migration_name,sha256,source) VALUES ('$name','$hash','verified existing production migration')"
                fi
              done
              apply_reporting_migration() {
                migration_file="$1"
                test -s "$migration_file" || {
                  echo "Required migration file is missing: $migration_file" >&2
                  exit 1
                }
                migration_name="$(basename "$migration_file")"
                migration_hash="$(sha256sum "$migration_file" | awk '{print $1}')"
                test "${#migration_hash}" -eq 64 || {
                  echo "Invalid migration fingerprint for $migration_name." >&2
                  exit 1
                }
                stored_hash="$(docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT sha256 FROM public.deployed_migration_fingerprints WHERE migration_name = '$migration_name'")"
                if [ -n "$stored_hash" ]; then
                  if [ "$stored_hash" != "$migration_hash" ]; then
                    echo "Stored fingerprint mismatch for $migration_name; refusing to reapply." >&2
                    exit 1
                  fi
                  echo "Skipping already-applied migration $migration_name (fingerprint matches)."
                  return
                fi
                {
                  printf 'BEGIN;\n'
                  cat "$migration_file"
                  printf "\nINSERT INTO public.deployed_migration_fingerprints(migration_name,sha256,source) VALUES ('%s','%s','GitHub Actions') ON CONFLICT (migration_name) DO NOTHING;\nCOMMIT;\n" "$migration_name" "$migration_hash"
                } | docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres
              }
              apply_reporting_migration "$staging/supabase/migrations/20261021001600_teacher_reporting_and_month_scope.sql"
              apply_reporting_migration "$staging/supabase/migrations/20261021001700_unified_teacher_withdrawals.sql"
              apply_reporting_migration "$staging/supabase/migrations/20261021001800_snapshot_in_person_teaching_duration.sql"
              apply_reporting_migration "$staging/supabase/migrations/20261022000100_manual_in_person_teacher_payouts.sql"
              apply_reporting_migration "$staging/supabase/migrations/20261022000200_canonical_teacher_balance_and_package_minutes.sql"
              for migration_file in \
                "$staging/supabase/migrations/20261021001600_teacher_reporting_and_month_scope.sql" \
                "$staging/supabase/migrations/20261021001700_unified_teacher_withdrawals.sql" \
                "$staging/supabase/migrations/20261021001800_snapshot_in_person_teaching_duration.sql" \
                "$staging/supabase/migrations/20261022000100_manual_in_person_teacher_payouts.sql" \
                "$staging/supabase/migrations/20261022000200_canonical_teacher_balance_and_package_minutes.sql"; do
                test -s "$migration_file"
                migration_name="$(basename "$migration_file")"
                expected_hash="$(sha256sum "$migration_file" | awk '{print $1}')"
                test "${#expected_hash}" -eq 64
                actual_hash="$(docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT sha256 FROM public.deployed_migration_fingerprints WHERE migration_name = '$migration_name'")"
                test -n "$actual_hash"
                test "$actual_hash" = "$expected_hash" || {
                  echo "Post-apply fingerprint verification failed for $migration_name." >&2
                  exit 1
                }
              done
              echo "Migrations 016-018 and 20261022 reporting fixes applied or fingerprint-verified; 011/012 fingerprinted and never re-run."
            else
              echo "Skipping teacher reporting/withdrawal migrations: no related SQL file changed."
            fi
            if [ "${RUN_EDGE_FUNCTIONS:-false}" = "true" ]; then
              functions_root=/root/taealam/supabase_setup/docker/volumes/functions
              for function_name in ai-support ai-tutor-token send-notification solve-homework; do
                install -D -m 0644 "$staging/supabase/functions/$function_name/index.ts" \
                  "$functions_root/$function_name/index.ts"
              done
              docker restart supabase-edge-functions
              echo "Updated subscription eligibility edge functions from this commit."
            else
              echo "Skipping edge functions: no related function source changed."
            fi
            policy_backup_dir="/root/backups/ajyal-nginx-policy-$DEPLOY_SHA"
            mkdir -p "$policy_backup_dir"
            chmod 700 "$policy_backup_dir"
            AJYAL_POLICY_BACKUP_DIR="$policy_backup_dir" python3 - <<'PY'
            import hashlib
            import os
            import re
            import shutil
            import subprocess
            import sys
            from pathlib import Path

            dump = subprocess.run(["nginx", "-T"], capture_output=True, text=True)
            if dump.returncode:
                sys.exit("Could not inspect the active Nginx configuration.")

            markers = list(re.finditer(r"(?m)^# configuration file (.+):$", dump.stdout))
            config_paths = []
            for marker in markers:
                path = Path(marker.group(1))
                if path.exists():
                    resolved = path.resolve()
                    if resolved not in config_paths:
                        config_paths.append(resolved)

            def mask_comments(text):
                return re.sub(r"(?m)^[ \t]*#.*$", lambda match: " " * len(match.group()), text)

            def server_blocks(text):
                masked = mask_comments(text)
                for start_match in re.finditer(r"\bserver\s*\{", masked):
                    opening = masked.find("{", start_match.start(), start_match.end())
                    depth = 0
                    for index in range(opening, len(masked)):
                        if masked[index] == "{":
                            depth += 1
                        elif masked[index] == "}":
                            depth -= 1
                            if depth == 0:
                                yield start_match.start(), index + 1, masked[start_match.start():index + 1]
                                break

            policy_pattern = re.compile(
                r'(?m)^([ \t]*add_header[ \t]+Permissions-Policy[ \t]+"[^"\n]*?)'
                r'geolocation=\(\)([^\n]*;[ \t]*)$'
            )
            edits = {}
            already_enabled = False
            unrecognized_policy_blocks = 0
            site_https_blocks = 0
            missing_policy_blocks = 0
            for config_path in config_paths:
                try:
                    source = config_path.read_text()
                except OSError:
                    continue
                for start, end, masked_block in server_blocks(source):
                    names = re.findall(r"(?m)^\s*server_name\s+([^;]+);", masked_block)
                    hosts = {host.rstrip(".").lower() for group in names for host in group.split()}
                    if not hosts.intersection({"ajyalalmaerifa.com", "www.ajyalalmaerifa.com"}):
                        continue
                    if not re.search(r"(?m)^\s*listen\s+[^;]*\b443\b[^;]*;", masked_block):
                        continue
                    site_https_blocks += 1
                    original_block = source[start:end]
                    print(f"Ajyal HTTPS config: {config_path}")
                    for line in original_block.splitlines():
                        if re.search(r"\b(add_header\s+Permissions-Policy|include|location)\b", line):
                            print("  " + line.strip())
                    if re.search(r'(?m)^\s*add_header\s+Permissions-Policy\b', masked_block):
                        replacement, count = policy_pattern.subn(
                            r"\1geolocation=(self)\2", original_block
                        )
                        if count:
                            edits.setdefault(config_path, []).append((start, end, replacement))
                        elif re.search(r'(?m)^\s*add_header\s+Permissions-Policy\s+"[^"\n]*geolocation=\(self\)', masked_block):
                            already_enabled = True
                        else:
                            unrecognized_policy_blocks += 1
                    else:
                        missing_policy_blocks += 1

            if site_https_blocks == 0:
                sys.exit("Could not find an active HTTPS server block for the Ajyal site.")
            if missing_policy_blocks:
                sys.exit(
                    "The Ajyal HTTPS server uses an inherited Permissions-Policy; "
                    "no Nginx files were changed."
                )
            if unrecognized_policy_blocks:
                sys.exit(
                    "The Ajyal HTTPS server has an unrecognized Permissions-Policy; "
                    "no Nginx files were changed."
                )
            backup_dir = Path(os.environ["AJYAL_POLICY_BACKUP_DIR"])
            manifest = backup_dir / "restore-manifest.tsv"
            manifest.write_text("")
            if not edits:
                if already_enabled:
                    print("The active site policy already permits first-party geolocation.")
                    sys.exit(0)
                sys.exit(
                    "Could not find a direct Permissions-Policy directive in the active "
                    "Ajyal site server block; no Nginx files were changed."
                )

            backups = []
            for config_path, ranges in edits.items():
                original = config_path.read_text()
                updated = original
                for start, end, replacement in sorted(ranges, reverse=True):
                    updated = updated[:start] + replacement + updated[end:]
                if updated == original:
                    continue
                backup = backup_dir / (
                    config_path.name + "-" +
                    hashlib.sha256(str(config_path).encode()).hexdigest()[:10] + ".bak"
                )
                shutil.copy2(config_path, backup)
                config_path.write_text(updated)
                backups.append((config_path, backup))

            manifest.write_text("".join(f"{path}\t{backup}\n" for path, backup in backups))
            validation = subprocess.run(["nginx", "-t"], capture_output=True, text=True)
            if validation.returncode:
                for config_path, backup in backups:
                    shutil.copy2(backup, config_path)
                sys.stderr.write(validation.stdout + validation.stderr)
                sys.exit("Nginx validation failed; the original site config was restored.")

            print(
                f"Enabled first-party geolocation in {len(backups)} active site config file(s); "
                f"backups are in {backup_dir}."
            )
            PY
            nginx -t
            # Keep previously hashed bundles available for live session tabs
            # that may still lazy-load a chunk during an Agora call.
            rsync -a --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r "$staging/dist/" /var/www/html/
            # Expire old hashed assets only after a grace window; the active
            # app/Agora connections are not restarted during this deployment.
            find /var/www/html/assets -type f -mmin +1440 -delete
            chmod 755 /var/www/html
            runuser -u www-data -- test -r /var/www/html/index.html
            runuser -u www-data -- test -r /var/www/html/assets/$(find /var/www/html/assets -maxdepth 1 -type f -name '*.js' -printf '%f\n' | head -n 1)
            systemctl reload nginx
            live_policy="$(curl -kfsSI --max-time 15 --resolve 'ajyalalmaerifa.com:443:127.0.0.1' https://ajyalalmaerifa.com/ | awk 'tolower($1) == "permissions-policy:" { print tolower($0) }' || true)"
            if [[ "$live_policy" != *"geolocation=(self)"* ]]; then
              echo "Local Nginx response did not enable first-party geolocation; restoring the saved policy."
              if [ -s "$policy_backup_dir/restore-manifest.tsv" ]; then
                while IFS="$(printf '\t')" read -r config_path backup_path; do
                  cp -a "$backup_path" "$config_path"
                done < "$policy_backup_dir/restore-manifest.tsv"
                nginx -t
                systemctl reload nginx
              fi
              echo "Proceeding with the web build; geolocation policy still needs a site-specific Nginx update."
            else
              echo "Local Nginx response confirms first-party geolocation is enabled."
            fi
            printf '%s\n' "$DEPLOY_SHA" > /root/ajyal-web-deployed-sha
            rm -rf "$staging"
            echo 'Web deployment activated'

