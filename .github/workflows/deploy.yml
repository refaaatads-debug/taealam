name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Create VPS backup before deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          script: |
            set -eu
            backup_dir="/root/backups/ajyal-predeploy-${{ github.sha }}"
            web_root="/var/www/html"
            functions_root="/root/taealam/supabase_setup/docker/volumes/functions"

            test -d "$web_root"
            test -d "$functions_root"
            mkdir -p "$backup_dir"
            chmod 700 "$backup_dir"
            tar -czf "$backup_dir/web-root.tar.gz" -C /var/www html
            tar -czf "$backup_dir/edge-functions.tar.gz" -C /root/taealam/supabase_setup/docker/volumes functions
            cp -a /root/deploy-ajyal.sh "$backup_dir/deploy-ajyal.sh"
            cat > "$backup_dir/restore.sh" <<EOF
            #!/bin/sh
            set -eu
            cd "$backup_dir"
            tar -xzf web-root.tar.gz -C /var/www
            tar -xzf edge-functions.tar.gz -C /root/taealam/supabase_setup/docker/volumes
            docker restart supabase-edge-functions
            nginx -t
            systemctl reload nginx
            EOF
            chmod 700 "$backup_dir/restore.sh"
            printf 'backup_sha=%s\ncreated_at_utc=%s\n' '${{ github.sha }}' "$(date -u +%FT%TZ)" > "$backup_dir/MANIFEST.txt"
            chmod 600 "$backup_dir/"*.tar.gz "$backup_dir/MANIFEST.txt" "$backup_dir/deploy-ajyal.sh"
            tar -tzf "$backup_dir/web-root.tar.gz" >/dev/null
            tar -tzf "$backup_dir/edge-functions.tar.gz" >/dev/null
            echo "VPS backup completed at $backup_dir"
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prepare private VPS build staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          script: |
            set -eu
            staging=/tmp/ajyal-build-${{ github.sha }}
            mkdir -p "$staging"
            chmod 700 "$staging"
      - name: Transfer source to isolated VPS build staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          source: src/**,public/**,index.html,package.json,package-lock.json,vite.config.ts,tsconfig.json,tsconfig.app.json,tsconfig.node.json,tailwind.config.ts,postcss.config.js,components.json
          target: /tmp/ajyal-build-${{ github.sha }}
          overwrite: true
      - name: Build and activate on VPS using the verified dependency cache
        uses: appleboy/ssh-action@v1.0.3
        env:
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAE9pV6wv3lWICbVL
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          envs: VITE_TURNSTILE_SITE_KEY,VITE_GOOGLE_MAPS_API_KEY
          script: |
            set -eu
            staging=/tmp/ajyal-build-${{ github.sha }}
            chmod 700 "$staging"
            test -f "$staging/index.html"
            test -f "$staging/package-lock.json"
            config_exports="$(python3 - <<'PY'
            import shlex
            import sys
            from urllib.parse import urlsplit

            env_path = "/root/taealam/.env"
            required = ("VITE_SUPABASE_URL", "VITE_SUPABASE_PUBLISHABLE_KEY")
            values = {}
            try:
                with open(env_path, encoding="utf-8") as env_file:
                    for line in env_file:
                        line = line.strip()
                        if not line or line.startswith("#") or "=" not in line:
                            continue
                        name, value = line.split("=", 1)
                        name, value = name.strip(), value.strip()
                        if name in required:
                            if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                                value = value[1:-1]
                            values[name] = value
            except OSError:
                print("Required VPS frontend configuration file is unavailable.", file=sys.stderr)
                sys.exit(1)

            missing = [name for name in required if not values.get(name)]
            if missing:
                print("Missing required frontend build configuration: " + ", ".join(missing), file=sys.stderr)
                sys.exit(1)
            parsed_url = urlsplit(values["VITE_SUPABASE_URL"])
            if parsed_url.scheme != "https" or not parsed_url.netloc:
                print("VITE_SUPABASE_URL must be a valid HTTPS URL.", file=sys.stderr)
                sys.exit(1)
            publishable_key = values["VITE_SUPABASE_PUBLISHABLE_KEY"]
            if not (publishable_key.startswith("sb_publishable_") or publishable_key.startswith("eyJ")):
                print("VITE_SUPABASE_PUBLISHABLE_KEY is not a recognized public key format.", file=sys.stderr)
                sys.exit(1)
            if publishable_key.startswith("sb_secret_") or "service_role" in publishable_key.lower():
                print("A server-only key cannot be used in the frontend build.", file=sys.stderr)
                sys.exit(1)
            for name in required:
                print(f"export {name}={shlex.quote(values[name])}")
            PY
            )"
            eval "$config_exports"
            unset config_exports
            test -n "${VITE_TURNSTILE_SITE_KEY:-}" || { echo "Missing VITE_TURNSTILE_SITE_KEY." >&2; exit 1; }
            test -n "${VITE_GOOGLE_MAPS_API_KEY:-}" || { echo "Missing VITE_GOOGLE_MAPS_API_KEY." >&2; exit 1; }
            expected_lock="$(cat /root/ajyal-build-deps/package-lock.sha256)"
            actual_lock="$(sha256sum "$staging/package-lock.json" | cut -c1-64)"
            test "$actual_lock" = "$expected_lock"
            ln -s /root/ajyal-build-deps/node_modules "$staging/node_modules"
            cd "$staging"
            npm run build
            test -f dist/index.html
            test -d dist/assets
            grep -Rql 'internal-call-transport-token' dist/assets
            grep -RFlq -- "$VITE_SUPABASE_URL" dist/assets
            grep -RFlq -- "$VITE_SUPABASE_PUBLISHABLE_KEY" dist/assets
            policy_backup_dir="/root/backups/ajyal-nginx-policy-${{ github.sha }}"
            mkdir -p "$policy_backup_dir"
            chmod 700 "$policy_backup_dir"
            AJYAL_POLICY_BACKUP_DIR="$policy_backup_dir" python3 - <<'PY'
            import hashlib
            import os
            import re
            import shutil
            import subprocess
            import sys
            from pathlib import Path

            dump = subprocess.run(["nginx", "-T"], capture_output=True, text=True)
            if dump.returncode:
                sys.exit("Could not inspect the active Nginx configuration.")

            markers = list(re.finditer(r"(?m)^# configuration file (.+):$", dump.stdout))
            config_paths = []
            for marker in markers:
                path = Path(marker.group(1))
                if path.exists():
                    resolved = path.resolve()
                    if resolved not in config_paths:
                        config_paths.append(resolved)

            def mask_comments(text):
                return re.sub(r"(?m)^[ \t]*#.*$", lambda match: " " * len(match.group()), text)

            def server_blocks(text):
                masked = mask_comments(text)
                for start_match in re.finditer(r"\bserver\s*\{", masked):
                    opening = masked.find("{", start_match.start(), start_match.end())
                    depth = 0
                    for index in range(opening, len(masked)):
                        if masked[index] == "{":
                            depth += 1
                        elif masked[index] == "}":
                            depth -= 1
                            if depth == 0:
                                yield start_match.start(), index + 1, masked[start_match.start():index + 1]
                                break

            policy_pattern = re.compile(
                r'(?m)^([ \t]*add_header[ \t]+Permissions-Policy[ \t]+"[^"\n]*?)'
                r'geolocation=\(\)([^\n]*;[ \t]*)$'
            )
            edits = {}
            already_enabled = False
            site_https_blocks = 0
            missing_policy_blocks = 0
            for config_path in config_paths:
                try:
                    source = config_path.read_text()
                except OSError:
                    continue
                for start, end, masked_block in server_blocks(source):
                    names = re.findall(r"(?m)^\s*server_name\s+([^;]+);", masked_block)
                    hosts = {host.rstrip(".").lower() for group in names for host in group.split()}
                    if not hosts.intersection({"ajyalalmaerifa.com", "www.ajyalalmaerifa.com"}):
                        continue
                    if not re.search(r"(?m)^\s*listen\s+[^;]*\b443\b[^;]*;", masked_block):
                        continue
                    site_https_blocks += 1
                    original_block = source[start:end]
                    if re.search(r'(?m)^\s*add_header\s+Permissions-Policy\b', masked_block):
                        if re.search(r'(?m)^\s*add_header\s+Permissions-Policy\s+"[^"\n]*geolocation=\(self\)', masked_block):
                            already_enabled = True
                            continue
                        replacement, count = policy_pattern.subn(
                            r"\1geolocation=(self)\2", original_block, count=1
                        )
                        if count:
                            edits.setdefault(config_path, []).append((start, end, replacement))
                    else:
                        missing_policy_blocks += 1

            if site_https_blocks == 0:
                sys.exit("Could not find an active HTTPS server block for the Ajyal site.")
            if missing_policy_blocks:
                sys.exit(
                    "The Ajyal HTTPS server uses an inherited Permissions-Policy; "
                    "no Nginx files were changed."
                )
            if not edits:
                if already_enabled:
                    print("The active site policy already permits first-party geolocation.")
                    sys.exit(0)
                sys.exit(
                    "Could not find a direct Permissions-Policy directive in the active "
                    "Ajyal site server block; no Nginx files were changed."
                )

            backup_dir = Path(os.environ["AJYAL_POLICY_BACKUP_DIR"])
            backups = []
            for config_path, ranges in edits.items():
                original = config_path.read_text()
                updated = original
                for start, end, replacement in sorted(ranges, reverse=True):
                    updated = updated[:start] + replacement + updated[end:]
                if updated == original:
                    continue
                backup = backup_dir / (
                    config_path.name + "-" +
                    hashlib.sha256(str(config_path).encode()).hexdigest()[:10] + ".bak"
                )
                shutil.copy2(config_path, backup)
                config_path.write_text(updated)
                backups.append((config_path, backup))

            validation = subprocess.run(["nginx", "-t"], capture_output=True, text=True)
            if validation.returncode:
                for config_path, backup in backups:
                    shutil.copy2(backup, config_path)
                sys.stderr.write(validation.stdout + validation.stderr)
                sys.exit("Nginx validation failed; the original site config was restored.")

            print(
                f"Enabled first-party geolocation in {len(backups)} active site config file(s); "
                f"backups are in {backup_dir}."
            )
            PY
            nginx -t
            rsync -a --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r dist/ /var/www/html/
            chmod 755 /var/www/html
            runuser -u www-data -- test -r /var/www/html/index.html
            runuser -u www-data -- test -r /var/www/html/assets/$(find /var/www/html/assets -maxdepth 1 -type f -name '*.js' -printf '%f\n' | head -n 1)
            systemctl reload nginx
            printf '%s\n' '${{ github.sha }}' > /root/ajyal-web-deployed-sha
            rm -rf "$staging"
            echo 'Web deployment activated'

