            if [ "${RUN_INPERSON_ROLES_MIGRATION:-false}" = "true" ]; then
              db_container="$(docker ps --filter name=supabase-db --format '{{.Names}}' | head -n 1)"
              test -n "$db_container"
              roles_migration_applied="$(docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT pg_get_functiondef('public.is_in_person_test_user()'::regprocedure) LIKE '%has_role%'")"
              if [ "$roles_migration_applied" = "t" ]; then
                echo "Skipping in-person role migration: its production function marker already exists."
              else
                docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < "$staging/supabase/migrations/20261021000800_enable_in_person_for_all_roles.sql"
              fi
            else
