              test -n "$db_container"
              acceptance_migration_applied="$(docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT EXISTS (SELECT 1 FROM information_schema.triggers WHERE trigger_schema = 'public' AND trigger_name = 'set_in_person_request_acceptance_deadline_trigger') AND EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid = 'public.in_person_request_groups'::regclass AND conname = 'in_person_request_groups_acceptance_before_lesson_check')")"
              if [ "$acceptance_migration_applied" = "t" ]; then
                echo "Skipping one-hour acceptance migration: its production schema marker already exists."
