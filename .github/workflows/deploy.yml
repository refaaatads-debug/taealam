name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_database_migrations:
        description: Apply the in-person database migrations
        required: false
        type: boolean
        default: false

concurrency:
  group: ajyal-production-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Refuse to deploy a stale commit
        shell: bash
        run: |
          current_main="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [ -z "$current_main" ] || [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Refusing stale deployment: workflow=$GITHUB_SHA main=${current_main:-unavailable}."
            exit 1
          fi
      - name: Create VPS backup before deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          script: |
            set -eu
            backup_dir="/root/backups/ajyal-predeploy-${{ github.sha }}"
            web_root="/var/www/html"
            functions_root="/root/taealam/supabase_setup/docker/volumes/functions"
            db_container="$(docker ps --filter name=supabase-db --format '{{.Names}}' | head -n 1)"

            test -d "$web_root"
            test -d "$functions_root"
            test -n "$db_container"
            mkdir -p "$backup_dir"
            chmod 700 "$backup_dir"
            docker exec -u postgres "$db_container" pg_dump -U postgres -d postgres -Fc --no-owner --no-acl > "$backup_dir/postgres.dump"
            test -s "$backup_dir/postgres.dump"
            docker exec -i -u postgres "$db_container" pg_restore --list < "$backup_dir/postgres.dump" >/dev/null
            tar -czf "$backup_dir/web-root.tar.gz" -C /var/www html
            tar -czf "$backup_dir/edge-functions.tar.gz" -C /root/taealam/supabase_setup/docker/volumes functions
            cp -a /root/deploy-ajyal.sh "$backup_dir/deploy-ajyal.sh"
            cat > "$backup_dir/restore.sh" <<EOF
            #!/bin/sh
            set -eu
            cd "$backup_dir"
            tar -xzf web-root.tar.gz -C /var/www
            tar -xzf edge-functions.tar.gz -C /root/taealam/supabase_setup/docker/volumes
            docker restart supabase-edge-functions
            nginx -t
            systemctl reload nginx
            EOF
            chmod 700 "$backup_dir/restore.sh"
            printf 'backup_sha=%s\ncreated_at_utc=%s\n' '${{ github.sha }}' "$(date -u +%FT%TZ)" > "$backup_dir/MANIFEST.txt"
            chmod 600 "$backup_dir/"*.tar.gz "$backup_dir/postgres.dump" "$backup_dir/MANIFEST.txt" "$backup_dir/deploy-ajyal.sh"
            tar -tzf "$backup_dir/web-root.tar.gz" >/dev/null
            tar -tzf "$backup_dir/edge-functions.tar.gz" >/dev/null
            echo "VPS backup completed at $backup_dir"
      - name: Detect in-person migration changes
        id: migration-scope
        shell: bash
        run: |
          run_migrations=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              && git diff --name-only "$before" "$GITHUB_SHA" -- supabase/migrations/20261021000100_city_in_person_availability.sql supabase/migrations/20261021000200_close_pending_disabled_city_requests.sql supabase/migrations/20261021000300_in_person_code_cancellation_and_cross_mode_guard.sql supabase/migrations/20261021000400_keep_unanswered_teacher_requests_open.sql | grep -q .; then
              run_migrations=true
            fi
          elif [ "${{ inputs.apply_database_migrations }}" = "true" ]; then
            run_migrations=true
          fi
          echo "run=$run_migrations" >> "$GITHUB_OUTPUT"
      - name: Detect teacher service-location sync migration
        id: teacher-location-migration-scope
        shell: bash
        run: |
          run_teacher_location_migration=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              && git diff --name-only "$before" "$GITHUB_SHA" -- supabase/migrations/20261026000200_sync_teacher_service_locations.sql supabase/migrations/20261026000300_separate_in_person_teaching_and_debit.sql .github/workflows/deploy.yml | grep -q .; then
              run_teacher_location_migration=true
            fi
          elif [ "${{ inputs.apply_database_migrations }}" = "true" ]; then
            run_teacher_location_migration=true
          fi
          echo "run=$run_teacher_location_migration" >> "$GITHUB_OUTPUT"
      - name: Detect one-hour acceptance migration
        id: acceptance-migration-scope
        shell: bash
        run: |
          run_acceptance_migration=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              && git diff --name-only "$before" "$GITHUB_SHA" -- supabase/migrations/20261021000600_in_person_one_hour_acceptance_window.sql | grep -q .; then
              run_acceptance_migration=true
            fi
          fi
          echo "run=$run_acceptance_migration" >> "$GITHUB_OUTPUT"
      - name: Detect in-person notifications migration
        id: notifications-migration-scope
        shell: bash
        run: |
          run_notifications_migration=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              && git diff --name-only "$before" "$GITHUB_SHA" -- supabase/migrations/20261021000700_in_person_notifications.sql | grep -q .; then
              run_notifications_migration=true
            fi
          fi
          echo "run=$run_notifications_migration" >> "$GITHUB_OUTPUT"
      - name: Detect in-person role rollout migration
        id: inperson-roles-scope
        shell: bash
        run: |
          run_inperson_roles_migration=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              && git diff --name-only "$before" "$GITHUB_SHA" -- supabase/migrations/20261021000800_enable_in_person_for_all_roles.sql | grep -q .; then
              run_inperson_roles_migration=true
            fi
          fi
          echo "run=$run_inperson_roles_migration" >> "$GITHUB_OUTPUT"
      - name: Detect teacher double-booking migration
        id: teacher-double-booking-scope
        shell: bash
        run: |
          run_teacher_double_booking_migration=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              && git diff --name-only "$before" "$GITHUB_SHA" -- supabase/migrations/20261021000900_prevent_teacher_double_booking.sql | grep -q .; then
              run_teacher_double_booking_migration=true
            fi
          fi
          echo "run=$run_teacher_double_booking_migration" >> "$GITHUB_OUTPUT"
      - name: Detect in-person pricing migration
        id: inperson-pricing-scope
        shell: bash
        run: |
          run_inperson_pricing_migration=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              && git diff --name-only "$before" "$GITHUB_SHA" -- supabase/migrations/20261021001000_in_person_teacher_pricing.sql | grep -q .; then
              run_inperson_pricing_migration=true
            fi
          elif [ "${{ inputs.apply_database_migrations }}" = "true" ]; then
            run_inperson_pricing_migration=true
          fi
          echo "run=$run_inperson_pricing_migration" >> "$GITHUB_OUTPUT"
      - name: Detect session finance migrations
        id: financial-migration-scope
        shell: bash
        run: |
          run_financial_migrations=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              && git diff --name-only "$before" "$GITHUB_SHA" -- supabase/migrations/20261021001300_in_person_session_financial_gates.sql supabase/migrations/20261021001400_idempotent_online_session_earning_rollup.sql supabase/migrations/20261021001500_financial_snapshot_and_duration_safety.sql supabase/migrations/20261026000100_configurable_in_person_package_minutes.sql | grep -q .; then
              run_financial_migrations=true
            fi
          elif [ "${{ inputs.apply_database_migrations }}" = "true" ]; then
            run_financial_migrations=true
          fi
          echo "run=$run_financial_migrations" >> "$GITHUB_OUTPUT"
      - name: Detect teacher reporting and withdrawal migrations
        id: reporting-withdrawal-migration-scope
        shell: bash
        run: |
          run_reporting_withdrawal_migrations=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              && git diff --name-only "$before" "$GITHUB_SHA" -- supabase/migrations/20261021001600_teacher_reporting_and_month_scope.sql supabase/migrations/20261021001700_unified_teacher_withdrawals.sql supabase/migrations/20261021001800_snapshot_in_person_teaching_duration.sql supabase/migrations/20261022000100_manual_in_person_teacher_payouts.sql supabase/migrations/20261022000200_canonical_teacher_balance_and_package_minutes.sql | grep -q .; then
              run_reporting_withdrawal_migrations=true
            fi
          elif [ "${{ inputs.apply_database_migrations }}" = "true" ]; then
            run_reporting_withdrawal_migrations=true
          fi
          echo "run=$run_reporting_withdrawal_migrations" >> "$GITHUB_OUTPUT"
      - name: Detect subscription eligibility edge-function changes
        id: edge-function-scope
        shell: bash
        run: |
          run_edge_functions=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              && git diff --name-only "$before" "$GITHUB_SHA" -- \
                supabase/functions/ai-support/index.ts \
                supabase/functions/ai-tutor-token/index.ts \
                supabase/functions/send-notification/index.ts \
                supabase/functions/solve-homework/index.ts | grep -q .; then
              run_edge_functions=true
            fi
          elif [ "${{ inputs.apply_database_migrations }}" = "true" ]; then
            run_edge_functions=true
          fi
          echo "run=$run_edge_functions" >> "$GITHUB_OUTPUT"
      - name: Prepare private VPS build staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          script: |
            set -eu
            staging=/tmp/ajyal-build-${{ github.sha }}
            mkdir -p "$staging"
            chmod 700 "$staging"
      - name: Transfer source to isolated VPS build staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          source: src/**,public/**,supabase/functions/ai-support/index.ts,supabase/functions/ai-tutor-token/index.ts,supabase/functions/send-notification/index.ts,supabase/functions/solve-homework/index.ts,supabase/migrations/20261021000100_city_in_person_availability.sql,supabase/migrations/20261021000200_close_pending_disabled_city_requests.sql,supabase/migrations/20261021000300_in_person_code_cancellation_and_cross_mode_guard.sql,supabase/migrations/20261021000400_keep_unanswered_teacher_requests_open.sql,supabase/migrations/20261021000600_in_person_one_hour_acceptance_window.sql,supabase/migrations/20261021000700_in_person_notifications.sql,supabase/migrations/20261021000800_enable_in_person_for_all_roles.sql,supabase/migrations/20261021000900_prevent_teacher_double_booking.sql,supabase/migrations/20261021001000_in_person_teacher_pricing.sql,supabase/migrations/20261021001100_in_person_session_lifecycle.sql,supabase/migrations/20261021001200_mode_aware_booking_expiry.sql,supabase/migrations/20261021001300_in_person_session_financial_gates.sql,supabase/migrations/20261021001400_idempotent_online_session_earning_rollup.sql,supabase/migrations/20261021001500_financial_snapshot_and_duration_safety.sql,supabase/migrations/20261021001600_teacher_reporting_and_month_scope.sql,supabase/migrations/20261021001700_snapshot_in_person_teaching_duration.sql,supabase/migrations/20261022000100_manual_in_person_teacher_payouts.sql,supabase/migrations/20261022000200_canonical_teacher_balance_and_package_minutes.sql,supabase/migrations/20261026000100_configurable_in_person_package_minutes.sql,supabase/migrations/20261026000200_sync_teacher_service_locations.sql,index.html,package.json,package-lock.json,vite.config.ts,tsconfig.json,tsconfig.app.json,tsconfig.node.json,tailwind.config.ts,postcss.config.js,components.json
          target: /tmp/ajyal-build-${{ github.sha }}
          overwrite: true
      - name: Transfer teaching/debit migration to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          source: supabase/migrations/20261026000300_separate_in_person_teaching_and_debit.sql
          target: /tmp/ajyal-build-${{ github.sha }}
          overwrite: true
      - name: Recheck main immediately before VPS activation
        shell: bash
        run: |
          current_main="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [ -z "$current_main" ] || [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Refusing VPS activation: workflow=$GITHUB_SHA main=${current_main:-unavailable}."
            exit 1
          fi
      - name: Build on VPS and apply booking finance migrations
        uses: appleboy/ssh-action@v1.0.3
        env:
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAE9pV6wv3lWICbVL
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          RUN_CITY_MIGRATIONS: ${{ steps.migration-scope.outputs.run }}
          RUN_ACCEPTANCE_MIGRATION: ${{ steps.acceptance-migration-scope.outputs.run }}
          RUN_NOTIFICATIONS_MIGRATION: ${{ steps.notifications-migration-scope.outputs.run }}
          RUN_INPERSON_ROLES_MIGRATION: ${{ steps.inperson-roles-scope.outputs.run }}
          RUN_TEACHER_DOUBLE_BOOKING_MIGRATION: ${{ steps.teacher-double-booking-scope.outputs.run }}
          RUN_INPERSON_PRICING_MIGRATION: ${{ steps.inperson-pricing-scope.outputs.run }}
          RUN_FINANCIAL_MIGRATIONS: ${{ steps.financial-migration-scope.outputs.run }}
          RUN_REPORTING_WITHDRAWAL_MIGRATIONS: ${{ steps.reporting-withdrawal-migration-scope.outputs.run }}
          RUN_EDGE_FUNCTIONS: ${{ steps.edge-function-scope.outputs.run }}
          RUN_TEACHER_LOCATION_SYNC_MIGRATION: ${{ steps.teacher-location-migration-scope.outputs.run }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          envs: VITE_TURNSTILE_SITE_KEY,VITE_GOOGLE_MAPS_API_KEY,RUN_CITY_MIGRATIONS,RUN_ACCEPTANCE_MIGRATION,RUN_NOTIFICATIONS_MIGRATION,RUN_INPERSON_ROLES_MIGRATION,RUN_TEACHER_DOUBLE_BOOKING_MIGRATION,RUN_INPERSON_PRICING_MIGRATION,RUN_FINANCIAL_MIGRATIONS,RUN_REPORTING_WITHDRAWAL_MIGRATIONS,RUN_EDGE_FUNCTIONS,RUN_TEACHER_LOCATION_SYNC_MIGRATION
          script: |
            set -eu
            staging=/tmp/ajyal-build-${{ github.sha }}
            chmod 700 "$staging"
            test -f "$staging/index.html"
            test -f "$staging/package-lock.json"
            test -f "$staging/supabase/migrations/20261021000100_city_in_person_availability.sql"
            test -f "$staging/supabase/migrations/20261021000200_close_pending_disabled_city_requests.sql"
            test -f "$staging/supabase/migrations/20261021000600_in_person_one_hour_acceptance_window.sql"
            test -f "$staging/supabase/migrations/20261021000700_in_person_notifications.sql"
            test -f "$staging/supabase/migrations/20261021000800_enable_in_person_for_all_roles.sql"
            test -f "$staging/supabase/migrations/20261021001000_in_person_teacher_pricing.sql"
            test -f "$staging/supabase/migrations/20261021001100_in_person_session_lifecycle.sql"
            test -f "$staging/supabase/migrations/20261021001200_mode_aware_booking_expiry.sql"
            test -f "$staging/supabase/migrations/20261021001300_in_person_session_financial_gates.sql"
            test -f "$staging/supabase/migrations/20261021001400_idempotent_online_session_earning_rollup.sql"
            test -f "$staging/supabase/migrations/20261021001500_financial_snapshot_and_duration_safety.sql"
            test -f "$staging/supabase/migrations/20261026000100_configurable_in_person_package_minutes.sql"
            test -f "$staging/supabase/migrations/20261026000200_sync_teacher_service_locations.sql"
            test -f "$staging/supabase/migrations/20261026000300_separate_in_person_teaching_and_debit.sql"
            test -f "$staging/supabase/migrations/20261021001600_teacher_reporting_and_month_scope.sql"
            test -f "$staging/supabase/migrations/20261021001700_unified_teacher_withdrawals.sql"
            test -f "$staging/supabase/migrations/20261021001800_snapshot_in_person_teaching_duration.sql"
            test -f "$staging/supabase/migrations/20261022000100_manual_in_person_teacher_payouts.sql"
            test -s "$staging/supabase/migrations/20261022000200_canonical_teacher_balance_and_package_minutes.sql"
            test -f "$staging/supabase/functions/ai-support/index.ts"
            test -f "$staging/supabase/functions/ai-tutor-token/index.ts"
            test -f "$staging/supabase/functions/send-notification/index.ts"
            test -f "$staging/supabase/functions/solve-homework/index.ts"
            config_exports="$(python3 - <<'PY'
            import shlex
            import sys
            from urllib.parse import urlsplit

            env_path = "/root/taealam/.env"
            required = ("VITE_SUPABASE_URL", "VITE_SUPABASE_PUBLISHABLE_KEY")
            values = {}
            try:
                with open(env_path, encoding="utf-8") as env_file:
                    for line in env_file:
                        line = line.strip()
                        if not line or line.startswith("#") or "=" not in line:
                            continue
                        name, value = line.split("=", 1)
                        name, value = name.strip(), value.strip()
                        if name in required:
                            if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                                value = value[1:-1]
                            values[name] = value
            except OSError:
                print("Required VPS frontend configuration file is unavailable.", file=sys.stderr)
                sys.exit(1)

            missing = [name for name in required if not values.get(name)]
            if missing:
                print("Missing required frontend build configuration: " + ", ".join(missing), file=sys.stderr)
                sys.exit(1)
            parsed_url = urlsplit(values["VITE_SUPABASE_URL"])
            if parsed_url.scheme != "https" or not parsed_url.netloc:
                print("VITE_SUPABASE_URL must be a valid HTTPS URL.", file=sys.stderr)
                sys.exit(1)
            publishable_key = values["VITE_SUPABASE_PUBLISHABLE_KEY"]
            if not (publishable_key.startswith("sb_publishable_") or publishable_key.startswith("eyJ")):
                print("VITE_SUPABASE_PUBLISHABLE_KEY is not a recognized public key format.", file=sys.stderr)
                sys.exit(1)
            if publishable_key.startswith("sb_secret_") or "service_role" in publishable_key.lower():
                print("A server-only key cannot be used in the frontend build.", file=sys.stderr)
                sys.exit(1)
            for name in required:
                print(f"export {name}={shlex.quote(values[name])}")
            PY
            )"
            eval "$config_exports"
            unset config_exports
            test -n "${VITE_TURNSTILE_SITE_KEY:-}" || { echo "Missing VITE_TURNSTILE_SITE_KEY." >&2; exit 1; }
            test -n "${VITE_GOOGLE_MAPS_API_KEY:-}" || { echo "Missing VITE_GOOGLE_MAPS_API_KEY." >&2; exit 1; }
            expected_lock="$(cat /root/ajyal-build-deps/package-lock.sha256)"
            actual_lock="$(sha256sum "$staging/package-lock.json" | cut -c1-64)"
            test "$actual_lock" = "$expected_lock"
            ln -s /root/ajyal-build-deps/node_modules "$staging/node_modules"
            cd "$staging"
            npm run build
            test -f dist/index.html
            test -d dist/assets
            grep -Rql 'internal-call-transport-token' dist/assets
            grep -RFlq -- "$VITE_SUPABASE_URL" dist/assets
            grep -RFlq -- "$VITE_SUPABASE_PUBLISHABLE_KEY" dist/assets
            if [ "${RUN_CITY_MIGRATIONS:-false}" = "true" ]; then
              db_container="$(docker ps --filter name=supabase-db --format '{{.Names}}' | head -n 1)"
              test -n "$db_container"
              docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < "$staging/supabase/migrations/20261021000100_city_in_person_availability.sql"
              docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < "$staging/supabase/migrations/20261021000200_close_pending_disabled_city_requests.sql"
              docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < "$staging/supabase/migrations/20261021000300_in_person_code_cancellation_and_cross_mode_guard.sql"
              docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < "$staging/supabase/migrations/20261021000400_keep_unanswered_teacher_requests_open.sql"
            else
              echo "Skipping in-person database migrations: this change did not modify their SQL files."
            fi
            if [ "${RUN_TEACHER_LOCATION_SYNC_MIGRATION:-false}" = "true" ]; then
              db_container="$(docker ps --filter name=supabase-db --format '{{.Names}}' | head -n 1)"
              test -n "$db_container"
              location_sync_applied="$(docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT EXISTS (SELECT 1 FROM information_schema.triggers WHERE trigger_schema = 'public' AND trigger_name = 'sync_teacher_service_location_to_profile_trigger') AND to_regprocedure('public.sync_teacher_service_location_to_profile()') IS NOT NULL")"
              if [ "$location_sync_applied" = "t" ]; then
                echo "Skipping teacher location sync migration: its production schema marker already exists."
              else
                docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < "$staging/supabase/migrations/20261026000200_sync_teacher_service_locations.sql"
              fi
              location_mismatches="$(docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT count(*) FROM public.teacher_profiles tp JOIN public.teacher_service_locations l ON l.teacher_id = tp.user_id WHERE tp.city_id IS DISTINCT FROM l.city_id OR tp.in_person_latitude IS DISTINCT FROM l.latitude OR tp.in_person_longitude IS DISTINCT FROM l.longitude OR tp.in_person_service_radius_km IS DISTINCT FROM l.service_radius_km")"
              test "$location_mismatches" = "0"
              duration_split_applied="$(docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'financial_settings' AND column_name = 'in_person_package_debit_minutes') AND to_regprocedure('public.get_in_person_package_debit_minutes()') IS NOT NULL AND pg_get_functiondef('public.create_in_person_request(uuid,timestamptz,uuid,uuid,uuid[],text)'::regprocedure) LIKE '%v_package_debit_minutes%'")"
              if [ "$duration_split_applied" = "t" ]; then
                echo "Skipping teaching/debit migration: its production schema marker already exists."
              else
                docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < "$staging/supabase/migrations/20261026000300_separate_in_person_teaching_and_debit.sql"
              fi
              configured_duration="$(docker exec -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT in_person_instruction_duration_minutes || ':' || in_person_package_debit_minutes FROM public.financial_settings ORDER BY updated_at DESC LIMIT 1")"
              test "$configured_duration" = "60:100"
              echo "Teacher service locations are synchronized; mismatched profiles were disabled pending location reapproval."
            else
              echo "Skipping teacher location sync migration: this change did not modify its SQL file."
