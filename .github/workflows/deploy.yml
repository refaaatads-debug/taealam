            fi
            if [ "${RUN_NOTIFICATIONS_MIGRATION:-false}" = "true" ]; then
              db_container="$(docker ps --filter name=supabase-db --format '{{.Names}}' | head -n 1)"
              test -n "$db_container"
              notifications_migration_applied="$(docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc "SELECT to_regclass('public.in_person_notification_events') IS NOT NULL AND EXISTS (SELECT 1 FROM information_schema.triggers WHERE trigger_schema = 'public' AND trigger_name = 'notify_in_person_group_insert') AND EXISTS (SELECT 1 FROM cron.job WHERE jobname = 'process-in-person-session-reminders')")"
              if [ "$notifications_migration_applied" = "t" ]; then
                echo "Skipping in-person notifications migration: its production schema markers already exist."
              else
                docker exec -i -u postgres "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < "$staging/supabase/migrations/20261021000700_in_person_notifications.sql"
              fi
            else
